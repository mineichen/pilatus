name: Rust

on:
  push:
    branches: ["main"]
    # Pushing a tag like `v0.2.0` publishes all crates to crates.io once all tests pass
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: DeterminateSystems/nix-installer-action@main
      
      - uses: DeterminateSystems/magic-nix-cache-action@main
      
      - name: Test with minimal features
        run: nix run .#test
      
      - name: Test with all features
        run: nix run .#test-all-features

  test_miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: DeterminateSystems/nix-installer-action@main
      
      - uses: DeterminateSystems/magic-nix-cache-action@main
      
      - name: Run Miri tests
        run: nix run .#miri-test

  build-book:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build book
        run: nix run .#build-book

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/book

  # Deploy in a separate job: the artifact lookup of deploy-pages can miss an artifact which was
  # uploaded moments before (https://github.com/actions/deploy-pages/issues/451). As a separate job,
  # "Re-run failed jobs" only reruns the deployment, instead of uploading a duplicate artifact.
  deploy-book:
    needs: build-book
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying the deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

  publish:
    needs: [test, test_miri]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Verify before requesting the short-lived crates.io token
      - name: Verify packages
        run: nix run .#publish -- --dry-run

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: nix run .#publish -- --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
